<h2>Lista de campos</h2>
<div class="search-bar">
  <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange($event)"
    placeholder="Buscar campos por nombre o ubicación">
</div>
<ng-container *ngIf="filteredPitches$ | async as pitches">
  <div class="pitch-cards">
    <div *ngFor="let pitch of pitches" class="pitch-card">
      <h3>{{ pitch.name }}</h3>
      <p><strong>Ubicación:</strong> {{ pitch.location }}</p>
      <p><strong>Establecimiento:</strong> {{ pitch?.establishment?.name }}</p>
      <div class="actions">
        <a [routerLink]="['/jugador/campos', pitch.id, 'detalles']" class="btn btn-details">Ver Detalles</a>
        <a [routerLink]="['/jugador/reserva', pitch.id]" class="btn btn-reserve">Reservar</a>
      </div>
    </div>
  </div>
  <div *ngIf="!pitches.length && !error && !loading" class="no-results">No se encontraron campos.</div>
</ng-container>
<div *ngIf="error" class="error">{{ error }}</div>
