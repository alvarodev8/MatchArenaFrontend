<h2>Perfil</h2>

<app-loading [isLoading]="isLoading"></app-loading>

@if (!isLoading) {
<div class="content">

    @if (user) {
    <div>
        <p><strong>Nombre:</strong> {{ user.name }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Rol:</strong> {{ user.role }}</p>
    </div>
    } @if (error) {
    <div class="alert alert-danger">
        {{ error }}
    </div>
    }
</div>
}
